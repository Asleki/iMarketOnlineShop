name: Build approved brand formats
on:
  push:
    branches: [main]
    paths:
      - 'assets/brand/*.svg'
      - 'assets/brand/build-assets.py'
      - '.github/workflows/brand-assets.yml'
permissions:
  contents: write
jobs:
  brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install brand rasterizer
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Render approved PNG WebP ICO
        run: python assets/brand/build-assets.py
      - name: Validate image manifest and create commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from xml.etree import ElementTree as ET
          p=Path('assets/brand')
          for stem in ['onstore-mark','nexagreen-mark','onstore-wordmark-on-dark','onstore-wordmark-on-light']:
              assert ET.parse(p/(stem+'.svg')).getroot().tag.endswith('svg')
          assert Image.open(p/'onstore-mark-512.png').size==(512,512)
          assert Image.open(p/'onstore-mark-192.png').size==(192,192)
          assert Image.open(p/'nexagreen-mark-512.webp').size==(512,512)
          assert Image.open(p/'onstore-favicon.ico').format=='ICO'
          assert Image.open(p/'onstore-social-1200x630.png').size==(1200,630)
          print('PASS: generated image formats and dimensions')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/
          if ! git diff --cached --quiet; then
            git commit -m "build(brand): publish approved PNG WebP and ICO variants"
            git push origin HEAD:main
          fi
