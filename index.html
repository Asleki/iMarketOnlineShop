<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="Explore the seven onStore shops for electronics, properties, vehicles, office essentials, bags, footwear, foods, and beverages.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="onStore">
  <meta property="og:title" content="onStore | Explore Our Shops">
  <meta property="og:description" content="Discover shops for electronics, properties, vehicles, office essentials, bags, footwear, foods, and beverages.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="onStore | Explore Our Shops">
  <meta name="twitter:description" content="Discover seven stores in one marketplace.">
  <title>onStore | Explore Our Shops</title>
  <link rel="icon" type="image/svg+xml" href="./assets/brand/onstore-mark.svg">
  <link rel="shortcut icon" type="image/x-icon" href="./assets/brand/onstore-favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/onstore-mark-180.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./assets/site.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main-content">
    <section id="featured" class="featured-hero" aria-label="Featured catalogue products">
      <div id="hero-slider" aria-roledescription="carousel" aria-label="Featured product showcase"><p class="shell">Loading featured products…</p></div>
    </section>
    <div id="home-offers"></div>
    <section id="recommendations" class="section shell" aria-labelledby="recommendations-title">
      <div class="section-heading"><div><p class="eyebrow">Picked around you</p><h2 id="recommendations-title">Your favourite categories</h2></div><button id="change-categories" class="button button-secondary" type="button">Edit categories</button></div>
      <div id="category-products"></div>
    </section>
    <section id="about" class="section shell section-quiet" aria-labelledby="about-title">
      <p class="eyebrow">About onStore</p>
      <h2 id="about-title">A simpler way to explore.</h2>
      <p>Browse distinct shops through one consistent marketplace experience.</p>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
